<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5421跑者 17th 團結日 #03 跑順 BINGO 盤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <div class="app">
    <!-- Hero -->
    <header class="hero">
      <img src="hero.jpg" alt="5421跑者 17th 團結日03 跑順BINGO盤" class="hero-img" />
      <div class="info-bar">
        <span class="info-pink">難易度 ★★★</span>
        <span class="info-green">11.7 <b>六</b> — 11.8 <b>日</b>　跑順BINGO盤</span>
      </div>
      <p class="hero-note">全組的里程點亮九宮格，連成 <b>1 條線</b>（橫、豎、斜）得 <b>2 分</b>；<br>九宮格<b>全部點亮</b>大滿貫，再加 <b>2 分</b>！</p>
    </header>

    <!-- Board -->
    <section class="panel progress-card">
      <div class="progress-top">
        <div class="stat">
          <span class="stat-label" id="progressSublabel">預計連線</span>
          <span class="stat-value"><span id="lineCount">0</span><small>條線</small></span>
        </div>
        <div class="stat stat-mid">
          <span class="stat-label">點亮格數</span>
          <span class="stat-value green"><span id="litCount">0</span><small>/ 9</small></span>
        </div>
        <div class="stat stat-right">
          <span class="stat-label">小組積分</span>
          <span class="stat-value pink"><span id="pointCount">0</span><small>分</small></span>
        </div>
      </div>

      <div class="bingo-wrap">
        <div class="bingo-letters" aria-hidden="true">
          <span class="l1">B</span><span class="l2">I</span><span class="l3">N</span><span class="l4">G</span><span class="l5">O</span>
        </div>
        <div class="bingo" id="bingoBoard"></div>
      </div>

      <div class="line-tags" id="lineTags"></div>
      <div class="hint-box" id="hintBox" style="display:none"></div>
    </section>

    <!-- Tabs -->
    <div class="tab-wrap">
      <button class="tab active" id="tabRegister">活動報名</button>
      <button class="tab" id="tabReport">里程回報</button>
    </div>

    <!-- Register form -->
    <section class="panel form-card" id="formRegister">
      <div class="form-row-header">
        <label>姓名 *</label>
        <span class="slots-left" id="slotsLeft">剩 — 位未報名</span>
      </div>
      <select id="registerName" class="select-input">
        <option value="">請選取組員...</option>
      </select>

      <label class="form-label">選擇要認領的格子 *（每人限選一格）</label>
      <div class="picker" id="cellPicker"></div>

      <div id="tailInputWrap" style="display:none">
        <label class="form-label" id="tailLabel">預計里程 (K) *</label>
        <input type="number" id="registerKm" class="text-input" placeholder="例如：11" step="1" min="1" inputmode="numeric" />
      </div>
      <p class="k-preview" id="registerPreview">　</p>
      <button class="submit-btn" id="submitRegister">確認送出報名</button>
    </section>

    <!-- Report form -->
    <section class="panel form-card" id="formReport" style="display:none">
      <div class="lock-banner" id="reportLockBanner">
        <div class="lock-icon">🔒</div>
        <div class="lock-text">
          <strong>里程回報尚未開放</strong>
          <span>請於 11/7（六）活動開始後再回填里程數</span>
        </div>
      </div>
      <div id="reportFormInner">
        <div class="form-row-header">
          <label>姓名 *</label>
          <span class="slots-left" id="reportSlotsLeft">剩 — 位未回報</span>
        </div>
        <select id="reportName" class="select-input">
          <option value="">請選取組員...</option>
        </select>
        <p class="k-preview" id="regHint">　</p>

        <label class="form-label">跑步日期 *</label>
        <div class="day-pills" id="reportDayPills">
          <button class="day-pill" data-day="11/7">11/7 <span>六</span></button>
          <button class="day-pill" data-day="11/8">11/8 <span>日</span></button>
        </div>

        <label class="form-label">實際完成里程 (K) *</label>
        <input type="number" id="reportKm" class="text-input" placeholder="例如：7.15" step="0.01" min="0" inputmode="decimal" />
        <p class="k-preview" id="reportPreview">　</p>
        <button class="submit-btn report-btn" id="submitReport">確認送出里程</button>
      </div>
    </section>

    <!-- Brand -->
    <div class="brand-badge">
      <div class="brand-left">
        <div class="brand-sub">RUNNING BANK</div>
        <div class="brand-name">BOGOTO</div>
      </div>
      <div class="brand-num">03</div>
      <div class="brand-right">
        <div class="brand-sub">ENJOY 組</div>
        <div class="brand-tag">17TH 團結日</div>
      </div>
    </div>

    <!-- Members -->
    <section class="members-section">
      <div class="members-list" id="membersList"></div>
    </section>

    <!-- Edit modal -->
    <div class="modal-overlay" id="editModal" style="display:none">
      <div class="modal-box">
        <h3 class="modal-title">編輯實際里程</h3>
        <p id="editName" class="modal-member"></p>
        <label class="form-label">跑步日期</label>
        <div class="day-pills" id="editDayPills">
          <button class="day-pill" data-day="11/7">11/7 <span>六</span></button>
          <button class="day-pill" data-day="11/8">11/8 <span>日</span></button>
        </div>
        <label class="form-label">實際完成里程 (K)</label>
        <input type="number" id="editKm" class="text-input" step="0.01" min="0" inputmode="decimal" />
        <p class="k-preview" id="editPreview">　</p>
        <div class="modal-btns">
          <button class="cancel-btn" id="cancelEdit">取消</button>
          <button class="submit-btn" id="saveEdit">儲存</button>
        </div>
      </div>
    </div>

    <!-- 5421 reminder modal -->
    <div class="modal-overlay" id="remindModal" style="display:none">
      <div class="modal-box remind-box">
        <div class="remind-icon">🏦</div>
        <h3 class="modal-title">跑銀 5421 提醒</h3>
        <p class="remind-text" id="remindText">請確認當週已經達成跑銀5421紀錄</p>
        <div class="modal-btns">
          <button class="cancel-btn" id="remindCancel">再想想</button>
          <button class="submit-btn" id="remindOk">已確認，送出</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script type="module" src="app.js?v=1"></script>
</body>
</html>
